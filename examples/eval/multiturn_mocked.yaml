name: Multi-Turn Mocked Eval
agent: ../yaml/basic/simple_chat.yaml

# Multi-turn mocked evaluation suite.
# Use this pattern when you want deterministic conversation checks in CI.
# No API key is required because the LLM responses are fixed below.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --agent examples/yaml/basic/simple_chat.yaml \
#     --scenarios examples/eval/multiturn_mocked.yaml \
#     --output target/eval/multiturn_mocked
#
# Flow: turn 1 input -> mocked response 1 -> assertions
#    -> turn 2 input -> mocked response 2 -> assertions -> reports
settings:
  timeout_per_turn_ms: 5000  # milliseconds to wait for each turn. default: 30000
  retries: 0                 # keep the example deterministic. default: 0
  isolation: scenario        # fresh runtime per attempt. default: scenario

# Mock responses are consumed in order for turns inside the scenario.
# If the scenario adds another turn, add another response here.
fixtures:
  llm:
    mode: mock
    responses:
      - "Hello! I can help with your request."
      - "Thanks for the details. I can help with the next step."

# A single scenario can contain multiple turns.
# This verifies conversation flow without relying on exact model behavior.
scenarios:
  - id: two-turn-conversation
    name: Two deterministic mocked turns pass
    tags: [basic, smoke, multi-turn]
    language: en
    turns:
      - input: Hello
        assert:
          all:
            - response_not_empty: true
            - response_contains: "Hello"
      - input: Thanks, what should I do next?
        assert:
          all:
            - response_not_empty: true
            - response_contains_any: ["Thanks", "next step"]
