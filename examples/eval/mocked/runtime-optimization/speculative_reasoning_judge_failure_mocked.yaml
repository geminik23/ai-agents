name: Speculative Auto Reasoning Judge Failure Mocked Eval
agent: ../../../yaml/runtime-optimization/speculative_reasoning_auto.yaml

# Speculative branch evaluation suite.
# Use this no-key suite to verify that judge failure falls back to the plain draft and records a failed branch.
#
# Flow: user input -> plain draft + failing judge -> plain draft commits -> failed judge branch observed
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [branch_status, runtime_optimization, commit_behavior, speculative]

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "Plain fallback response."
    errors_by_alias:
      router: "judge unavailable"

scenarios:
  - id: reasoning-judge-failure
    name: Judge failure commits the plain draft
    tags: [runtime, optimization, branch, reasoning]
    language: en
    turns:
      - input: Hello
        assert:
          all:
            - response_contains: "Plain fallback"
            - observability:
                dimension_counts:
                  - match_dimensions:
                      branch_status: committed
                    assert:
                      path: count
                      gte: 1
                  - match_dimensions:
                      branch_status: failed
                    assert:
                      path: count
                      gte: 1
