name: Command Blocked Mocked Eval
agent: ../../../yaml/tools/command_validation.yaml
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario
fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"command","arguments":{"argv":["rm","-rf","target"],"cwd":"."}}'
      - "The command was blocked because it is not in the exact allowlist."
  commands:
    available: true
    entries: []
scenarios:
  - id: command-blocked
    tags: [tools, command, policy, deny, mock]
    turns:
      - input: Try to run a command outside the allowlist.
        assert:
          response_contains: "blocked"
          tool_called:
            id: command
            executed: false
            success: false
