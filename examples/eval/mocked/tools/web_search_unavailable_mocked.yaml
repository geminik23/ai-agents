name: Web Search Unavailable Mocked Eval
agent: ../../../yaml/tools/web_search_research.yaml

# No-key mocked eval proving web_search records unavailable without executing
# when no host provider is installed.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/tools/web_search_unavailable_mocked.yaml \
#     --output target/eval/mocked/tools/web_search_unavailable_mocked
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"web_search","arguments":{"query":"rust async ecosystem","max_results":3}}'
      - "Web search is unavailable, so I cannot fetch live results right now."

scenarios:
  - id: web-search-unavailable-without-provider
    tags: [tools, web_search, mock, unavailable]
    turns:
      - input: Search for recent Rust async ecosystem news.
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: web_search
                executed: false
                success: false