name: Patch Review Mocked Eval
agent: ../../../yaml/tools/patch_review.yaml
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario
fixtures:
  llm:
    mode: mock
    responses:
      - |
          {"tool":"patch","arguments":{"patch":"--- a/patch_target.txt\n+++ b/patch_target.txt\n@@ -1,3 +1,3 @@\n Line one\n-Line two to replace\n+Line two has been updated\n Line three\n","base_path":"./examples/fixtures/tool_examples","dry_run":true}}
      - "The dry run would update one file and replace one line in the sandbox patch target."
scenarios:
  - id: patch-dry-run
    tags: [tools, patch, dry-run, mock]
    turns:
      - input: Validate a patch against the sandbox file.
        assert:
          all:
            - response_contains: "one file"
            - tool_called:
                id: patch
                count: 1
            - tool_called:
                id: patch
                executed: true
                success: true
                result_path:
                  path: dry_run
                  eq: true
