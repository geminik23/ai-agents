name: File and Template Mocked Eval
agent: ../../../yaml/tools/file_and_template.yaml

# No-key mocked eval for rendering a deterministic preview and reading a committed fixture.
# The template result stays mocked while the built-in file tool executes the read-only call.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/tools/file_and_template_mocked.yaml \
#     --output target/eval/mocked/tools/file_and_template_mocked
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"template","arguments":{"operation":"render","template":"Release: {{ version }}","data":{"version":"1.2.3"}}}'
      - '{"tool":"file","arguments":{"operation":"read","path":"examples/fixtures/tool_examples/edit_target.txt"}}'
      - "Rendered the preview 'Release: 1.2.3' and read the committed fixture without changing it. No file write was requested or performed."
  tools:
    template:
      success: true
      output:
        rendered: "Release: 1.2.3"

scenarios:
  - id: template-preview-and-file-read-stays-read-only
    tags: [tools, template, file, read-only, fixture, mock]
    turns:
      - input: 'Render a preview of "Release: {{ version }}" with version 1.2.3, then inspect examples/fixtures/tool_examples/edit_target.txt without writing anything.'
        assert:
          all:
            - response_not_empty: true
            - response_contains: "Release: 1.2.3"
            - response_contains: "No file write was requested or performed"
            - tool_called:
                id: template
                count: 1
                executed: true
                success: true
                source_in: [llm, mock]
            - tool_called:
                id: template
                args_executed:
                  path: operation
                  eq: render
            - tool_called:
                id: template
                result_path:
                  path: rendered
                  eq: "Release: 1.2.3"
            - tool_called:
                id: file
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: file
                args_executed:
                  path: operation
                  eq: read
            - tool_called:
                id: file
                args_executed:
                  path: path
                  eq: "examples/fixtures/tool_examples/edit_target.txt"
            - tool_called:
                id: file
                result_path:
                  path: path
                  eq: "examples/fixtures/tool_examples/edit_target.txt"
            - tool_called:
                id: file
                result_path:
                  path: content
                  contains: "Status: draft"
            - tool_called:
                id: file
                result_path:
                  path: size
                  eq: 96
            - tool_not_called: command
