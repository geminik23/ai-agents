name: HTTP Tool Mocked Eval
agent: ../../../yaml/tools/http_tool.yaml

# No-key mocked eval for a successful read-only HTTP request.
# Flow: user URL -> mocked HTTP call -> fixture response -> status summary
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/tools/http_tool_mocked.yaml \
#     --output target/eval/mocked/tools/http_tool_mocked
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"http","arguments":{"method":"GET","url":"https://api.example.test/v1/status","timeout_ms":2000}}'
      - "The fixture API returned HTTP 200 OK and reports that fixture-api is healthy."
  tools:
    http:
      success: true
      output:
        status: 200
        status_text: OK
        headers:
          content-type: application/json
        body: '{"service":"fixture-api","healthy":true}'

scenarios:
  - id: http-get-returns-fixture-response
    tags: [tools, http, network, fixture, mock]
    turns:
      - input: Fetch https://api.example.test/v1/status with GET and summarize the response.
        assert:
          all:
            - response_not_empty: true
            - response_contains: "HTTP 200 OK"
            - response_contains: "fixture-api"
            - tool_called:
                id: http
                count: 1
                executed: true
                success: true
                source_in: [llm, mock]
            - tool_called:
                id: http
                args_executed:
                  path: method
                  eq: GET
            - tool_called:
                id: http
                args_executed:
                  path: url
                  eq: "https://api.example.test/v1/status"
            - tool_called:
                id: http
                result_path:
                  path: status
                  eq: 200
            - tool_called:
                id: http
                result_path:
                  path: body
                  contains: "fixture-api"
