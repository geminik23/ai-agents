name: HTTP Tool Mocked Eval
agent: ../../../yaml/tools/http_tool.yaml

# No-key mocked eval for a successful read-only HTTP request.
# Flow: fixture URL -> real HTTP tool -> local mock server -> status summary
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/tools/http_tool_mocked.yaml \
#     --output target/eval/mocked/tools/http_tool_mocked
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"http","arguments":{"method":"GET","url":"{{ mock_server.base_url }}/v1/status","timeout_ms":2000}}'
      - "The fixture API returned HTTP 200 OK and reports that fixture-api is healthy."
  mock_server:
    enabled: true
    routes:
      - method: GET
        path: /v1/status
        status: 200
        headers:
          Content-Type: application/json
        body:
          service: fixture-api
          healthy: true

scenarios:
  - id: http-get-returns-fixture-response
    tags: [tools, http, network, fixture, mock]
    turns:
      - input: Fetch the fixture status endpoint with GET and summarize the response.
        assert:
          all:
            - response_not_empty: true
            - response_contains: "HTTP 200 OK"
            - response_contains: "fixture-api"
            - tool_called:
                id: http
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: http
                args_executed:
                  path: method
                  eq: GET
            - tool_called:
                id: http
                args_executed:
                  path: url
                  contains: "/v1/status"
            - tool_called:
                id: http
                result_path:
                  path: status
                  eq: 200
            - tool_called:
                id: http
                result_path:
                  path: body
                  contains: "fixture-api"
