name: Sleep Wait Mocked Eval
agent: ../../../yaml/tools/sleep_wait.yaml
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario
fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"sleep","arguments":{"duration_ms":1,"reason":"short eval wait"}}'
      - "Waited briefly and stayed within the configured cap."
scenarios:
  - id: sleep-bounded-wait
    tags: [tools, sleep, mock]
    turns:
      - input: Wait briefly before answering.
        assert:
          response_contains: "Waited briefly"
          tool_called:
            id: sleep
            executed: true
            success: true
            result_path:
              path: max_duration_ms
              eq: 1000
