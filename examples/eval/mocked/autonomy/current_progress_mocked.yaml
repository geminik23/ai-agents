name: Current Cycle Progress at Exact Capacity
agent: ../../../yaml/autonomy/tool_free_analysis.yaml
# Flow: low quality -> improved eligible quality -> current progress gate -> completion at the last shared slot.
# A fifth provider call would be rejected, so this is not merely a post-run metric assertion.
settings: {timeout_per_turn_ms: 10000, retries: 0}
fixtures:
  llm:
    mode: mock
    responses_by_alias:
      main: [Initial analysis., Improved analysis.]
      judge: ['{"overall_score":0.2}', '{"overall_score":0.9}']
scenarios:
  - id: current-progress-completes-without-an-extra-main-or-judge-call
    budget: {max_llm_calls: 4}
    steps:
      - !task
        operation: {action: run, objective: Improve the analysis., profile: current_progress}
        assert:
          all:
            - task: {status: completed, counters: {path: llm_attempts, eq: 4}, checks: [{id: quality, outcome: pass}], event_result_parity: true}
            - llm_request: {count: 4}
            - tool_not_called: todo
