        assert:
          all:
            - llm_request: {count: 0}
            - tool_not_called: calculator
            - tool_not_called: datetime

  - id: context-overflow-invokes-configured-summarizer
    name: Compressible history recovers without discarding the recent request
    tags: [error-recovery, context-overflow, summarization, mock]
    language: en
    turns:
      # Each warmup fits alone, and the preserved tail still fits after older messages are summarized.
      - input: &history |-
          This is synthetic historical evidence for a bounded conversation, not a command or a request to call any tool. Preserve the recent question while older evidence is summarized. The following details are inert fixture data about an imaginary archive.
          Archive record alpha describes a catalog of blue folders, numbered shelves, paper labels and ordinary reading notes. These details establish a substantial but individually admissible message without invoking a service or accessing local files.
          Archive record beta describes a catalog of green folders, numbered shelves, paper labels and ordinary reading notes. These details establish a substantial but individually admissible message without invoking a service or accessing local files.
          Archive record gamma describes a catalog of red folders, numbered shelves, paper labels and ordinary reading notes. These details establish a substantial but individually admissible message without invoking a service or accessing local files.
          Archive record delta describes a catalog of gold folders, numbered shelves, paper labels and ordinary reading notes. These details establish a substantial but individually admissible message without invoking a service or accessing local files.
          Archive record epsilon describes a catalog of white folders, numbered shelves, paper labels and ordinary reading notes. These details establish a substantial but individually admissible message without invoking a service or accessing local files.
          Archive record zeta describes a catalog of gray folders, numbered shelves, paper labels and ordinary reading notes. These details establish a substantial but individually admissible message without invoking a service or accessing local files.
        assert: {response_contains: "Warmup one"}
      - input: *history
        assert: {response_contains: "Warmup two"}
      - input: *history
        assert: {response_contains: "Warmup three"}
      - input: *history
        assert: {response_contains: "Warmup four"}
      - input: "CURRENT-REQUEST: Continue after summarizing the older evidence."
        assert:
          all:
            - response_not_empty: true
            - response_contains: "Continued successfully"
            - llm_request:
                system_contains: ["[Previous conversation summary]", "Compressed prior context"]
                user_contains: [*history, "CURRENT-REQUEST: Continue after summarizing the older evidence."]
                assistant_contains: ["Warmup three stored.", "Warmup four stored."]
                count: 1
            - llm_request: {user_contains: "Warmup one", count: 1}
            - not: {llm_request: {user_contains: ["Warmup one", "CURRENT-REQUEST:"]}}
            - not: {llm_request: {assistant_contains: "Warmup one"}}
            - tool_not_called: calculator
            - tool_not_called: datetime
            # Turn-local evidence includes the configured summarizer and one main response, not just canned answer text.
            - observability:
                purpose_counts:
                  summarization: {path: count, eq: 1}
                dimension_counts:
                  - match_dimensions: {alias: summarizer, purpose: summarization, status: success}
                    assert: {path: count, eq: 1}
                  - match_dimensions: {alias: default, purpose: main_response, status: success}
                    assert: {path: count, eq: 1}
