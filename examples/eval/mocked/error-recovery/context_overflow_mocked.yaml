name: Context Overflow Mocked Eval
agent: ../../../yaml/error-recovery/context_overflow.yaml

# No-key coverage for both bounded recovery and irreducible recent-input refusal.
# Flow: admissible warmups -> compressible older history -> summary plus intact recent request.
# A first input larger than the whole window has no older history to summarize; no provider may run.
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [alias, purpose, status]

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "Warmup one stored."
        - "Warmup two stored."
        - "Warmup three stored."
        - "Warmup four stored."
        - "Continued successfully after context summarization."
      summarizer:
        - "Compressed prior context for the active conversation."

scenarios:
  - id: oversized-current-input-is-rejected-before-dispatch
    name: A protected first input cannot be made to fit by dropping it
    tags: [error-recovery, context-overflow, summarization, mock]
    language: en
    turns:
