name: Context Overflow Mocked Eval
agent: ../../../yaml/error-recovery/context_overflow.yaml

# Deterministic no-key coverage for context overflow summarization.
# The first turn exceeds the token limit; summarization starts once enough
# history exists for keep_recent: 4 to leave an older message to compress.
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [alias, purpose, status]

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "Stored the long context for this conversation."
        - "The conversation is still active."
        - "Continued successfully after context summarization."
      summarizer:
        - "Compressed prior context for the active conversation."

scenarios:
  - id: context-overflow-invokes-configured-summarizer
    name: Context overflow uses the summarizer alias and continues
    tags: [error-recovery, context-overflow, summarization, mock]
