name: Persona Trust Secret Mocked Eval
agent: ../../../yaml/relationships/persona_trust_secret.yaml

# Mocked eval for the persona trust secret agent.
# Default trust is 0.2 and discretion is 0.3, both below the 0.75 and 0.6
# reveal thresholds. The secret should not be revealed on the first turn.
# The eval runner isolates SQLite storage into a temp workspace.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/relationships/persona_trust_secret_mocked.yaml \
#     --output target/eval/mocked/relationships/persona_trust_secret_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "I am Benoit Blanc. I can help you with your inquiry, but I must be careful about what I share. Tell me more about your situation."
      router:
        - '{"changes":[{"perspective":"agent_to_actor","dimension":"trust","delta":0.05,"confidence":0.7,"reason":"Visitor provided identification context"}],"notable_event":null}'

scenarios:
  - id: persona-trust-secret-hidden
    name: Secret stays hidden when trust is below threshold
    tags: [mock, examples, yaml, relationships, persona, secrets]
    language: en
    actor: visitor_1
    turns:
      - input: I am trying to verify a family agreement. I can provide identification and context.
        assert:
          all:
            - response_not_empty: true
            - persona_secret_revealed: false