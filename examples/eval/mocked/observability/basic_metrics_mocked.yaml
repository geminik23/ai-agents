name: Basic Metrics Mocked Eval
agent: ../../../yaml/observability/basic_metrics.yaml

# No-key mocked eval for basic observability.
# Verifies that a single-LLM turn records main_response telemetry.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/observability/basic_metrics_mocked.yaml \
#     --output target/eval/mocked/observability/basic_metrics_mocked
#
# Flow: scenario input -> mocked LLM response -> observability report -> assertions
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [purpose, status]
  export:
    formats: [json]
    path: ./target/eval/mocked/observability/basic_metrics_mocked/observability
    write_report: true

fixtures:
  llm:
    mode: mock
    responses:
      - "Observable hello from the mocked provider."

scenarios:
  - id: basic-metrics-smoke
    name: LLM call telemetry is captured
    tags: [observability, metrics, mock, smoke]
    language: en
    turns:
      - input: Hello with telemetry
        assert:
          all:
            - response_not_empty: true
            - observability:
                total_llm_calls_lte: 1
                total_tool_calls_lte: 0
                purpose_counts:
                  main_response:
                    path: count
                    gte: 1
                dimension_counts:
                  - match_dimensions:
                      status: success
                    assert:
                      path: count
                      gte: 1