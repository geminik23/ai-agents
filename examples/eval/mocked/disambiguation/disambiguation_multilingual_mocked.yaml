name: Disambiguation Multilingual Mocked Eval
agent: ../../../yaml/disambiguation/disambiguation_multilingual.yaml

# Mocked disambiguation eval suite.
# Verifies Korean ambiguous input triggers clarification in the same language.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/disambiguation/disambiguation_multilingual_mocked.yaml \
#     --output target/eval/mocked/disambiguation/disambiguation_multilingual_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      router:
        - "no"
        - '{"is_ambiguous":true,"confidence":0.2,"ambiguity_type":"missing_target","reasoning":"unclear what to send","what_is_unclear":["target"],"detected_language":"ko"}'
        - '{"question":"무엇을 보내드릴까요?","options":[{"id":"money","label":"돈","description":"송금"},{"id":"message","label":"메시지","description":"메시지 전송"}]}'

scenarios:
  - id: korean-ambiguous-triggers-clarification
    name: Korean vague input triggers disambiguation in same language
    tags: [mock, examples, yaml, disambiguation, multilingual]
    language: ko
    turns:
      - input: "그거 보내줘"
        assert:
          all:
            - response_not_empty: true
            - disambiguation: triggered
            - response_contains: "보내드릴까요"