name: Disambiguation Basic Social Mocked Eval
agent: ../../../yaml/disambiguation/disambiguation_basic.yaml

# Mocked disambiguation eval suite.
# Verifies that social greetings skip disambiguation entirely.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/disambiguation/disambiguation_basic_social_mocked.yaml \
#     --output target/eval/mocked/disambiguation/disambiguation_basic_social_mocked
#
# Flow: social check (yes) -> skip -> normal response
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      router:
        - "yes"
      default:
        - "Hello! How can I help you today?"

scenarios:
  - id: social-input-skips-disambiguation
    name: Social greeting skips disambiguation entirely
    tags: [mock, examples, yaml, disambiguation]
    language: en
    turns:
      - input: Hello!
        assert:
          all:
            - response_not_empty: true
            - no_disambiguation: true
            - response_contains: "Hello"