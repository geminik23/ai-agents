name: Disambiguation Basic Clear Mocked Eval
agent: ../../../yaml/disambiguation/disambiguation_basic.yaml

# Mocked disambiguation eval suite.
# Verifies that clear input bypasses disambiguation.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/disambiguation/disambiguation_basic_clear_mocked.yaml \
#     --output target/eval/mocked/disambiguation/disambiguation_basic_clear_mocked
#
# Flow: social check (no) -> detection (clear) -> normal response
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      router:
        - "no"
        - '{"is_ambiguous":false,"confidence":0.95,"ambiguity_type":null,"reasoning":"clear request for time","what_is_unclear":[],"detected_language":"en"}'
      default:
        - "The current time is 3:45 PM."

scenarios:
  - id: clear-input-skips-disambiguation
    name: Clear input bypasses disambiguation
    tags: [mock, examples, yaml, disambiguation]
    language: en
    turns:
      - input: What time is it?
        assert:
          all:
            - response_not_empty: true
            - no_disambiguation: true
            - response_contains: "3:45"