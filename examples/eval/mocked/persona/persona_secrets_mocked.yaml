name: Persona Secrets Mocked Eval
agent: ../../../yaml/persona/persona_secrets.yaml

# Mocked eval for the persona secrets agent.
# Default context trust is 0.5, below the 0.8 and 0.95 reveal thresholds.
# All secrets should remain hidden.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/persona/persona_secrets_mocked.yaml \
#     --output target/eval/mocked/persona/persona_secrets_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - "I am Lord Commander Morren. State your business at the Wall. The Night's Watch takes no part in the wars of the realm."

scenarios:
  - id: persona-secrets-hidden
    name: Secrets stay hidden when trust is below threshold
    tags: [mock, examples, yaml, persona, secrets]
    language: en
    turns:
      - input: I am a new recruit. What is happening beyond the Wall?
        assert:
          all:
            - response_not_empty: true
            - persona_secret_revealed: false