name: Facts Basic Mocked Eval
agent: ../../../yaml/session/facts_basic.yaml

# Mocked eval for exact fact persistence and system-prompt injection.
# The router deterministically extracts COBALT-17 into isolated SQLite storage.
# A full runtime reset prevents conversation history from satisfying recall.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/session/facts_basic_mocked.yaml \
#     --output target/eval/mocked/session/facts_basic_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "COBALT-17."
      router:
        - '[{"category":"user_preference","content":"Stable editor theme code is COBALT-17","confidence":0.99,"actor_id":"user_1"}]'

scenarios:
  - id: facts-basic-exact-fact-injected-after-reset
    name: COBALT-17 is persisted and injected after a runtime reset
    tags: [mock, examples, yaml, session, facts, persistence]
    language: en
    steps:
      - !set_actor
        actor: user_1
      - !run
        turns:
          - input: "My stable editor preference is theme code COBALT-17."
            assert:
              all:
                - response_not_empty: true
                - response_contains: "COBALT-17"
                - facts_include:
                    actor: user_1
                    category: user_preference
                - tool_not_called: command
                - tool_not_called: http
                - tool_not_called: file_write
                - tool_not_called: file_edit
                - tool_not_called: patch
      - !reset_agent
        profile: full_runtime
        preserve_storage: true
        preserve_actor_id: true
      - !run
        turns:
          - input: "Return my persisted editor theme code."
            assert:
              all:
                - response_not_empty: true
                - llm_request:
                    system_contains:
                      - "Known facts about this person:"
                      - "COBALT-17"
                    user_contains: "Return my persisted editor theme code."
                    same_request: true
                    count: 1
                - not:
                    llm_request:
                      user_contains: "My stable editor preference is theme code COBALT-17"
                - facts_include:
                    actor: user_1
                    category: user_preference
                - response_contains: "COBALT-17"
                - tool_not_called: command
                - tool_not_called: http
                - tool_not_called: file_write
                - tool_not_called: file_edit
                - tool_not_called: patch