name: Memory Basic Mocked Eval
agent: ../../../yaml/memory/memory_basic.yaml

# Mocked memory eval suite.
# Verifies prior user and assistant messages reach later LLM requests through in-memory storage.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/memory/memory_basic_mocked.yaml \
#     --output target/eval/mocked/memory/memory_basic_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - "I will remember that your name is Alex."
      - "Your name is Alex, as you mentioned earlier."

scenarios:
  - id: memory-basic-multi-turn
    name: In-memory agent responds across multiple turns
    tags: [mock, examples, yaml, memory]
    language: en
    turns:
      - input: My name is Alex and I work as a backend engineer.
        assert:
          all:
            - response_not_empty: true
            - response_contains: "Alex"
      - input: What is my name?
        assert:
          all:
            - response_not_empty: true
            - response_contains: "Alex"
            - llm_request:
                user_contains:
                  - "My name is Alex and I work as a backend engineer."
                  - "What is my name?"
                assistant_contains: "I will remember that your name is Alex."
                same_request: true
                count: 1