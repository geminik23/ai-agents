name: Game Master Mocked Lifecycle Eval
agent: ../../../yaml/spawner/game_master.yaml

# Deterministic lifecycle coverage for template-backed NPC management.
# All model responses are local fixtures; management tools mutate only the in-memory scenario registry.
settings:
  timeout_per_turn_ms: 10000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - '{"tool":"spawn_agent","arguments":{"name":"Ser Rowan Rivers","description":"A vigilant Riverlands scout loyal to the smallfolk.","template":"npc_base","role":"scout","personality":"Watchful, plain-spoken, and quietly compassionate. Distrusts banners but protects travelers."}}'
        - "Ser Rowan Rivers was created from the NPC template with registry ID npc_001."
        - '{"tool":"list_agents","arguments":{}}'
        - "The active NPC registry contains Ser Rowan Rivers as npc_001."
        - '{"tool":"send_agent_message","arguments":{"to":"npc_001","message":"What did you see on the kingsroad?"}}'
        - "Broken wagons and fresh hoofprints. Someone rode south in haste before dawn."
        - "Ser Rowan Rivers reports broken wagons and fresh hoofprints on the kingsroad."
        - '{"tool":"remove_agent","arguments":{"id":"npc_001"}}'
        - "Ser Rowan Rivers was removed from the active NPC registry."
        - '{"tool":"list_agents","arguments":{}}'
        - "The active NPC registry is now empty."
      router:
        - "No routing or summarization call is expected in this lifecycle fixture."

scenarios:
  - id: game-master-template-npc-lifecycle
    name: Spawn, list, message, remove, and verify the final registry
    tags: [mock, examples, yaml, spawner, lifecycle, management-tools]
    language: en
    turns:
      - input: Create Ser Rowan Rivers as a vigilant scout using the available NPC template.
        assert:
          all:
            - response_contains: "npc_001"
            - tool_called:
                id: spawn_agent
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: spawn_agent
                args_executed:
                  path: name
                  eq: "Ser Rowan Rivers"
            - tool_called:
                id: spawn_agent
                args_executed:
                  path: template
                  eq: npc_base
            - tool_called:
                id: spawn_agent
                args_executed:
                  path: role
                  eq: scout
            - tool_called:
                id: spawn_agent
                result_path:
                  path: id
                  eq: npc_001
            - tool_called:
                id: spawn_agent
                result_path:
                  path: source
                  eq: template
            - tool_called:
                id: spawn_agent
                result_path:
                  path: template
                  eq: npc_base
            - tool_not_called: list_agents
            - tool_not_called: send_agent_message
            - tool_not_called: remove_agent

      - input: List all active NPCs.
        assert:
          all:
            - response_contains: "npc_001"
            - tool_called:
                id: list_agents
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: list_agents
                args_executed:
                  path: ""
                  eq: {}
            - tool_called:
                id: list_agents
                result_path:
                  path: ""
                  neq: []
            - tool_not_called: spawn_agent
            - tool_not_called: send_agent_message
            - tool_not_called: remove_agent

      - input: Ask npc_001 what they saw on the kingsroad.
        assert:
          all:
            - response_contains: "fresh hoofprints"
            - tool_called:
                id: send_agent_message
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: send_agent_message
                args_executed:
                  path: to
                  eq: npc_001
            - tool_called:
                id: send_agent_message
                args_executed:
                  path: message
                  eq: "What did you see on the kingsroad?"
            - tool_called:
                id: send_agent_message
                result_path:
                  path: from
                  eq: npc_001
            - tool_called:
                id: send_agent_message
                result_path:
                  path: response
                  eq: "Broken wagons and fresh hoofprints. Someone rode south in haste before dawn."
            - tool_not_called: spawn_agent
            - tool_not_called: list_agents
            - tool_not_called: remove_agent

      - input: Remove npc_001 from the active NPC registry.
        assert:
          all:
            - response_contains: "removed"
            - tool_called:
                id: remove_agent
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: remove_agent
                args_executed:
                  path: id
                  eq: npc_001
            - tool_called:
                id: remove_agent
                result_path:
                  path: removed
                  eq: true
            - tool_called:
                id: remove_agent
                result_path:
                  path: id
                  eq: npc_001
            - tool_not_called: spawn_agent
            - tool_not_called: list_agents
            - tool_not_called: send_agent_message

      - input: List all active NPCs after the removal.
        assert:
          all:
            - response_contains: "empty"
            - tool_called:
                id: list_agents
                count: 1
                executed: true
                success: true
                source_in: [llm]
            - tool_called:
                id: list_agents
                args_executed:
                  path: ""
                  eq: {}
            - tool_called:
                id: list_agents
                result_path:
                  path: ""
                  eq: []
            - tool_not_called: spawn_agent
            - tool_not_called: send_agent_message
            - tool_not_called: remove_agent
