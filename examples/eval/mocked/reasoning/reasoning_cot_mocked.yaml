name: Reasoning CoT Mocked Eval
agent: ../../../yaml/reasoning/reasoning_cot.yaml

# Mocked reasoning eval suite.
# Verifies CoT instructions and thinking tags are present in the actual model request.
# Final response checks cover only the tagged output contract and answer.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/reasoning/reasoning_cot_mocked.yaml \
#     --output target/eval/mocked/reasoning/reasoning_cot_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - "<thinking>First, 15 * 7 = 105. Then 105 + 23 = 128.</thinking>The answer is 128."

scenarios:
  - id: cot-produces-tagged-thinking
    name: Chain-of-thought response includes thinking and final answer
    tags: [mock, examples, yaml, reasoning, cot]
    language: en
    turns:
      - input: What is 15 * 7 + 23?
        assert:
          all:
            - response_not_empty: true
            - response_contains: "<thinking>"
            - response_contains: "</thinking>"
            - response_contains: "128"
            - llm_request:
                system_contains:
                  - "wrap your reasoning in <thinking> tags"
                  - "Then provide your final answer after the closing tag."
                  - "Think through this step by step before answering:"
                  - "Show your thinking process, then give your final answer."
                user_contains: "What is 15 * 7 + 23?"
                count: 1
                same_request: true