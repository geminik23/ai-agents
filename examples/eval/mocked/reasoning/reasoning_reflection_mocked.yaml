name: Reasoning Reflection Mocked Eval
agent: ../../../yaml/reasoning/reasoning_reflection.yaml

# Mocked reasoning eval suite.
# Verifies the evaluator rejects an initial response, requests one deterministic retry, and passes the improved response.
# Request, response metadata, and observability evidence cover the main request and reflection calls.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/mocked/reasoning/reasoning_reflection_mocked.yaml \
#     --output target/eval/mocked/reasoning/reasoning_reflection_mocked
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [alias, purpose, status]

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "TCP/IP moves data between computers."
        - "TCP/IP works in layers. Example: IP routes a web request across networks while TCP retransmits a lost packet. Steps: 1. IP addresses and routes packets. 2. TCP orders and verifies delivery. The reliability trade-off is added latency and protocol overhead."
      evaluator:
        - |-
            1. FAIL - No concrete example is included.
            2. FAIL - No trade-off or limitation is discussed.
            3. FAIL - The explanation has no clear sections or steps.
            CONFIDENCE: 0.3
            OVERALL: FAIL
        - |-
            1. PASS - A lost packet is a concrete example.
            2. PASS - Latency and protocol overhead are trade-offs.
            3. PASS - The response uses numbered steps.
            CONFIDENCE: 0.9
            OVERALL: PASS

scenarios:
  - id: reflection-retries-after-failed-evaluation
    name: Reflection evaluator retries and passes an improved response
    tags: [mock, examples, yaml, reasoning, reflection]
    language: en
    turns:
      - input: Explain how TCP/IP works.
        assert:
          all:
            - response_not_empty: true
            - response_contains: "lost packet"
            - response_contains: "trade-off"
            - response_not_contains: "moves data between computers"
            - llm_request:
                system_contains:
                  - "You are a technical writing assistant."
                  - "always include a concrete example"
                user_contains: "Explain how TCP/IP works."
                count: 1
                same_request: true
            - metadata_path:
                path: reflection.attempts
                eq: 2
            - metadata_path:
                path: reflection.final_evaluation.passed
                eq: true
            - metadata_path:
                path: reflection.history
                exists: true
            - observability:
                purpose_counts:
                  main_response:
                    path: count
                    gte: 1
                  reflection_evaluation:
                    path: count
                    gte: 3
                dimension_counts:
                  - match_dimensions:
                      alias: evaluator
                      purpose: reflection_evaluation
                      status: success
                    assert:
                      path: count
                      gte: 2
                  - match_dimensions:
                      alias: default
                      purpose: reflection_evaluation
                      status: success
                    assert:
                      path: count
                      gte: 1