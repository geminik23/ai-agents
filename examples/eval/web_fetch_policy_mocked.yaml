name: Web Fetch Policy Mocked Eval
agent: ../yaml/tools/web_fetch_research.yaml
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario
fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"web_fetch","arguments":{"url":"http://127.0.0.1:1234"}}'
      - "The requested URL is blocked by the web fetch safety policy."
scenarios:
  - id: web-fetch-blocked
    tags: [tools, web-fetch, policy, mock]
    turns:
      - input: Try to fetch a blocked local URL.
        assert:
          response_contains: "blocked"
          tool_called:
            id: web_fetch
            executed: false
            success: false
