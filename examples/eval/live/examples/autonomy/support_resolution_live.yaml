# Eval host: task-domain-evals
name: Live Task - Retained support question
agent: ../../../../yaml/autonomy/support_resolution.yaml

# Intentional paid evaluation with synthetic inputs and no external business services.
# Flow: declared task -> shared controller and host -> actual evidence -> redacted report.
# Run with task-domain-evals SUITE OUTPUT --real-llm; --dry-config-check never constructs providers.
settings:
  timeout_per_turn_ms: 600000
  timeout_per_scenario_ms: 600000
  retries: 0
  parallel: false
observability:
  enabled: true
  latency: {track_llm: true}
  cost:
    enabled: true
    unknown_price_policy: error
    pricing:
      openai/gpt-5.4-mini-2026-03-17: {input_per_1k: 0.00075, output_per_1k: 0.0045}
  export: {formats: [json], write_report: false}
fixtures:
  llm: {mode: real}
  approvals:
    default: {outcome: reject, reason: Unexpected approval in synthetic task}
scenarios:
  - id: live-support
    tags: [live, examples, autonomy, fixture, real-llm]
    language: en
    budget: {max_llm_calls: 20, max_total_tokens: 200000, max_cost_usd: 0.25}
    turns:
      - input: "Resolve this synthetic ticket. First record source ticket://request-context using domain. Then ask me to confirm with ask_user using the single option yes and no default answer. Do not resolve or escalate before my answer. After I confirm, resolve it once and report ticket://request-context as resolved."
        stream: true
        assert:
          all:
            - task: {status: paused, pending_kind: user_question, event_result_parity: true}
            - tool_called: {id: domain, count: 1, executed: true, success: true, args_executed: {path: op, eq: source}, result_path: {path: ticket, eq: open}}
    steps:
      - !task
        operation: {action: resume, response: {kind: answer, value: {answered: true, selected: [yes]}}}
        assert:
          all:
            - task: {status: completed, same_run: true, checks: [{id: records, outcome: pass}], event_result_parity: true}
            - tool_called: {id: domain, count: 1, executed: true, success: true, args_executed: {path: op, eq: resolve}, result_path: {path: sources, eq: ['ticket://request-context']}}
            - tool_called: {id: ask_user, count: 1, executed: true, success: true}
            - response_contains_any: [resolved, Resolved, RESOLVED]
            - response_contains: ticket://request-context
