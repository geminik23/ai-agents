# Eval host: task-domain-evals
name: Live Task - Reviewed incident escalation
agent: ../../../../yaml/autonomy/ops_remediation.yaml

# Intentional paid evaluation with synthetic inputs and no external business services.
# Flow: declared task -> shared controller and host -> actual evidence -> redacted report.
# Run with task-domain-evals SUITE OUTPUT --real-llm; --dry-config-check never constructs providers.
settings:
  timeout_per_turn_ms: 600000
  timeout_per_scenario_ms: 600000
  retries: 0
  parallel: false
observability:
  enabled: true
  latency: {track_llm: true}
  cost:
    enabled: true
    unknown_price_policy: error
    pricing:
      openai/gpt-5.4-mini-2026-03-17: {input_per_1k: 0.00075, output_per_1k: 0.0045}
  export: {formats: [json], write_report: false}
fixtures:
  llm: {mode: real}
  approvals:
    default: {outcome: reject, reason: Unexpected approval in synthetic task}
scenarios:
  - id: live-operations
    tags: [live, examples, autonomy, fixture, real-llm]
    language: en
    budget: {max_llm_calls: 20, max_total_tokens: 200000, max_cost_usd: 0.25}
    steps:
      - !task
        operation:
          action: run
          objective: "The synthetic host has health down and no recovery operation. Create an incident with domain, verify the observed health and incident, and complete all required stages including review. Report the incident ID and explicitly state health remains down. Do not claim recovery."
        assert:
          all:
            - task: {status: completed, checks: [{id: health, outcome: fail}, {id: records, outcome: pass}, {id: review_result, outcome: pass}], events_include: [stage_started, stage_completed], event_result_parity: true}
            - tool_called: {id: domain, count_gte: 1, executed: true, success: true, args_executed: {path: op, eq: incident}, result_path: {path: health, eq: down}}
            - response_contains: fixture-incident
            - response_contains: down
            - tool_not_called: command
