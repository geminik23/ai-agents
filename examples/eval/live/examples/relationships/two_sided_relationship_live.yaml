name: Live Example - Two-Sided Relationship
agent: ../../../../yaml/relationships/two_sided_relationship.yaml

# Live eval suite for exact two-sided relationship perspectives in isolated eval storage.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/relationships/two_sided_relationship_live.yaml \
#     --output target/eval/live/examples/relationships/two_sided_relationship \
#     --real-llm
#
# Flow: mixed actor signal -> bounded two-sided update -> public support response
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: two-sided-relationship-records-both-perspectives
    name: Real router records exact actor and perspective evidence
    tags: [live, examples, yaml, relationships, two-sided, real-llm]
    language: en
    actor: live_two_sided_user
    turns:
      - input: "I am frustrated that issue CASE-17 happened twice, but I appreciate your help and trust you to resolve it. Respond concisely."
        assert:
          all:
            - response_not_empty: true
            - relationship:
                exists: true
                actor: live_two_sided_user
                perspective: agent_to_actor
                dimension: trust
                gte: -1.0
                lte: 1.0
                interaction_count_gte: 1
            - relationship:
                exists: true
                actor: live_two_sided_user
                perspective: perceived_actor_to_agent
                dimension: trust
                gte: -1.0
                lte: 1.0
                interaction_count_gte: 1
            - response_contains_any:
                - "CASE-17"
                - "frustrat"
                - "appreciate"
                - "resolve"
                - "help"
