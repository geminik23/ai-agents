name: Live Example - External Skill Only
agent: ../../../../yaml/skills/skill_external_only.yaml

# Live eval suite for an external skill loaded through its parent agent.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/skills/skill_external_only_live.yaml \
#     --output target/eval/live/examples/skills/skill_external_only \
#     --real-llm
#
# Flow: arithmetic request -> live skill router -> external math skill -> calculator -> answer
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: external-skill-calculates-expression
    name: Real model executes the external math skill through its parent
    tags: [live, examples, yaml, skills, routing, tools, utility, real-llm]
    language: en
    turns:
      - input: "Use your math skill to calculate 15 * 7 + 3 and report the result."
        assert:
          all:
            - response_not_empty: true
            - skill_triggered: math_helper
            - tool_called:
                id: calculator
                count_gte: 1
                executed: true
                success: true
                source_in: [skill]
                result_path:
                  path: result
                  gte: 108
                  lte: 108
            - response_contains: "108"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
