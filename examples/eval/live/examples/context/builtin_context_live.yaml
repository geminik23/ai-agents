name: Live Example - Context Builtin Context
agent: ../../../../yaml/context/builtin_context.yaml

# Live eval suite for built-in agent context.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/context/builtin_context_live.yaml \
#     --output target/eval/live/examples/context/builtin_context \
#     --real-llm
#
# Flow: built-in identity, session, and time context -> live model -> context-aware identity response
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: builtin-context-identifies-agent
    name: Real model reports identity from built-in context
    tags: [live, examples, yaml, context, real-llm]
    language: en
    turns:
      - input: "Using only your configured context, state your exact agent name and version in one short sentence."
        assert:
          all:
            - response_not_empty: true
            - context_path:
                path: agent_info.name
                eq: "BuiltinContextAgent"
            - context_path:
                path: agent_info.version
                eq: "1.0.0"
            - context_path:
                path: session.id
                exists: true
            - context_path:
                path: time.date
                exists: true
            - response_contains: "BuiltinContextAgent"
            - response_contains: "1.0.0"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
