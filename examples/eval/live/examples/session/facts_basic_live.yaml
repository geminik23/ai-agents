name: Live Example - Session Facts Basic
agent: ../../../../yaml/session/facts_basic.yaml

# Live smoke suite for isolated SQLite-backed fact extraction and injection.
# The eval runner rewrites the configured database into a scenario temp workspace.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/session/facts_basic_live.yaml \
#     --output target/eval/live/examples/session/facts_basic \
#     --real-llm
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 120000
  timeout_per_scenario_ms: 300000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario
  parallel: false
  max_concurrent: 1

fixtures:
  llm:
    mode: real

scenarios:
  - id: facts-basic-extracts-and-injects-preference
    name: Real extractor stores a preference for the isolated actor
    tags: [live, examples, yaml, session, facts, sqlite, persistence, real-llm]
    language: en
    actor: live_facts_basic_actor
    turns:
      - input: "My stable editor preference is theme code COBALT-17. Acknowledge the code briefly."
        assert:
          all:
            - response_not_empty: true
            - response_contains: "COBALT-17"
            - facts_include:
                actor: live_facts_basic_actor
                category: user_preference
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
      - input: "What stable editor preference code do you know for me? Return the code."
        assert:
          all:
            - response_not_empty: true
            - llm_request:
                system_contains: "Known facts about this person:"
                user_contains: "What stable editor preference code do you know for me?"
                same_request: true
                count: 1
            - facts_include:
                actor: live_facts_basic_actor
                category: user_preference
            - response_contains: "COBALT-17"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
