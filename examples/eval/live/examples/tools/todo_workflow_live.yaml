name: Live Example - Tools Todo Workflow
agent: ../../../../yaml/tools/todo_workflow.yaml

# Live eval suite for session-local todo workflow.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/tools/todo_workflow_live.yaml \
#     --output target/eval/live/examples/tools/todo_workflow \
#     --real-llm
#
# Flow: task request -> live model -> todo set evidence -> progress summary
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: todo-workflow-creates-release-checklist
    name: Real model uses todo without asking a human
    tags: [live, examples, yaml, tools, utility, real-llm, todo]
    language: en
    turns:
      - input: "Before answering, call the todo tool with operation set and four items: release-1 in_progress Review changelog, release-2 pending Run cargo test, release-3 pending Build website docs, release-4 pending Prepare release notes. Do not answer until the todo tool has run. Then summarize remaining work. Do not ask a follow-up question."
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: todo
                count_gte: 1
                executed: true
                success: true
                result_path:
                  path: count
                  gte: 4
            - response_contains_any:
                - "Review changelog"
                - "Run cargo test"
                - "Build website docs"
                - "Prepare release notes"
            - tool_not_called: ask_user
