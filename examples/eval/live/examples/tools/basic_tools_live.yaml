name: Live Example - Tools Basic Tools
agent: ../../../../yaml/tools/basic_tools.yaml

# Live eval suite for calculator and datetime utilities.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/tools/basic_tools_live.yaml \
#     --output target/eval/live/examples/tools/basic_tools \
#     --real-llm
#
# Flow: one utility request -> live model -> matching tool evidence -> concise answer
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: basic-tools-calculates-expression
    name: Real model uses calculator
    tags: [live, examples, yaml, tools, utility, real-llm, calculator]
    language: en
    turns:
      - input: "Before answering, call the calculator tool to calculate (100 - 37) * 4 / 3. Do not do mental math."
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: calculator
                count_gte: 1
                executed: true
                success: true
                result_path:
                  path: result
                  gte: 84
                  lte: 84
            - response_contains: "84"

  - id: basic-tools-gets-current-date
    name: Real model uses datetime
    tags: [live, examples, yaml, tools, utility, real-llm, datetime]
    language: en
    turns:
      - input: "Before answering, call the datetime tool to report the current UTC date in ISO format, and include the word UTC in the answer."
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: datetime
                count_gte: 1
                executed: true
                success: true
                result_path:
                  path: iso
                  exists: true
            - response_contains: "UTC"
