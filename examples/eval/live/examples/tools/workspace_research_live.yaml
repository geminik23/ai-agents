name: Live Example - Tools Workspace Research
agent: ../../../../yaml/tools/workspace_research.yaml

# Live eval suite for workspace research with read-only discovery tools.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/tools/workspace_research_live.yaml \
#     --output target/eval/live/examples/tools/workspace_research \
#     --real-llm
#
# Flow: one workspace request -> live model -> read-only tool evidence -> summary
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: workspace-research-lists-tool-examples
    name: Real model lists YAML tool examples
    tags: [live, examples, yaml, tools, read-only, real-llm, glob, file_list]
    language: en
    turns:
      - input: "Before answering, call file_list or glob to inspect examples/yaml/tools. Summarize which example files are read-only, utility-focused, or dry-run mutation oriented."
        assert:
          all:
            - response_not_empty: true
            - any:
                - tool_called:
                    id: file_list
                    count_gte: 1
                    executed: true
                    success: true
                - tool_called:
                    id: glob
                    count_gte: 1
                    executed: true
                    success: true
            - response_contains_any:
                - "code_search.yaml"
                - "repo_review.yaml"
                - "file_write_sandbox.yaml"
                - "patch_review.yaml"
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
            - tool_not_called: command

  - id: workspace-research-reads-code-search-example
    name: Real model reads one YAML tool example
    tags: [live, examples, yaml, tools, read-only, real-llm, file_read]
    language: en
    turns:
      - input: "Before answering, call file_read on examples/yaml/tools/code_search.yaml. Summarize the read-only tools granted by that example."
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: file_read
                count_gte: 1
                executed: true
                success: true
            - response_contains_any:
                - "glob"
                - "grep"
                - "file_read"
                - "file_list"
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
            - tool_not_called: command
