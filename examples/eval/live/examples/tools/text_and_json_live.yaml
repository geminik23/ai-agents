name: Live Example - Tools Text And Json
agent: ../../../../yaml/tools/text_and_json.yaml

# Live eval suite for local text and JSON processing tools.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/tools/text_and_json_live.yaml \
#     --output target/eval/live/examples/tools/text_and_json \
#     --real-llm
#
# Flow: one utility request -> live model -> local utility tool evidence -> result summary
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: text-tool-counts-unicode
    name: Real model uses text
    tags: [live, examples, yaml, tools, utility, real-llm, text]
    language: en
    turns:
      - input: "Before answering, call the text tool to count the characters in 'hello world'."
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: text
                count_gte: 1
                executed: true
                success: true
                result_path:
                  path: length
                  eq: 11
            - response_contains_any:
                - "11"
                - "eleven"

  - id: json-tool-extracts-path
    name: Real model uses JSON
    tags: [live, examples, yaml, tools, utility, real-llm, json]
    language: en
    turns:
      - input: "Before answering, call the JSON tool to extract user.name from {\"user\":{\"name\":\"Alice\",\"age\":30}}."
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: json
                count_gte: 1
                executed: true
                success: true
            - response_contains_any:
                - "Alice"
                - "alice"
                - "name"
