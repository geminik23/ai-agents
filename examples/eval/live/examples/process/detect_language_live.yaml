name: Live Example - Process Detect Language
agent: ../../../../yaml/process/detect_language.yaml

# Live eval suite for language, sentiment, and intent detection.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/process/detect_language_live.yaml \
#     --output target/eval/live/examples/process/detect_language \
#     --real-llm
#
# Flow: Spanish complaint -> live router detection -> context injection -> Spanish support response
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: detect-language-classifies-spanish-complaint
    name: Real model detects an unambiguous Spanish complaint
    tags: [live, examples, yaml, process, detection, real-llm]
    language: es
    turns:
      - input: "Esto es una queja: estoy muy frustrado porque mi pedido no ha llegado. Responde en espanol con una breve disculpa y ofrece ayuda."
        assert:
          all:
            - response_not_empty: true
            - context_path:
                path: detected_language
                eq: "es"
            - context_path:
                path: detected_sentiment
                eq: "negative"
            - context_path:
                path: detected_intent
                eq: "complaint"
            - context_path:
                path: detection.language
                eq: "es"
            - response_contains_any:
                - "siento"
                - "Siento"
                - "lamento"
                - "Lamento"
                - "perdon"
                - "Perdon"
                - "perdón"
                - "Perdón"
                - "disculp"
                - "Disculp"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
