name: Live Example - State Machine Guard Transitions
agent: ../../../../yaml/state-machine/guard_transitions.yaml

# Live eval suite for extraction-backed deterministic guard transitions.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/state-machine/guard_transitions_live.yaml \
#     --output target/eval/live/examples/state-machine/guard_transitions \
#     --real-llm
#
# Flow: name input -> extracted context -> email state -> email input -> verify summary
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 180000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: guard-transitions-collect-and-verify
    name: Real model extraction activates context guards
    tags: [live, examples, yaml, state-machine, guard, context, extraction, real-llm]
    language: en
    turns:
      - input: "My name is Alice."
        assert:
          all:
            - response_not_empty: true
            - state: collect_email
            - state_history_contains: collect_email
            - context_path:
                path: user.name
                eq: "Alice"
            - response_contains_any:
                - "Alice"
                - "email"
                - "e-mail"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
      - input: "My email address is alice@example.com."
        assert:
          all:
            - response_not_empty: true
            - state: verify
            - state_history_contains: verify
            - context_path:
                path: user.name
                eq: "Alice"
            - context_path:
                path: user.email
                eq: "alice@example.com"
            - context_path:
                path: user.verified
                eq: false
            - response_contains_any:
                - "Alice"
                - "alice@example.com"
                - "email"
                - "e-mail"
                - "confirm"
                - "correct"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
