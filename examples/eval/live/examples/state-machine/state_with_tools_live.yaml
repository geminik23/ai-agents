name: Live Example - State Machine State With Tools
agent: ../../../../yaml/state-machine/state_with_tools.yaml

# Live eval suite for state-level tool narrowing.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/state-machine/state_with_tools_live.yaml \
#     --output target/eval/live/examples/state-machine/state_with_tools \
#     --real-llm
#
# Flow: greeting state with no tools -> transition to lookup -> scoped calculation tool execution
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: state-scoped-tools-narrow-grant
    name: Real model transitions before using scoped tools
    tags: [live, examples, yaml, tools, grant, scoping, state-machine, real-llm, calculator]
    language: en
    turns:
      - input: "Hi, I need help with a math calculation."
        assert:
          all:
            - response_not_empty: true
            - state_history_contains: lookup
            - tool_not_called: calculator
            - tool_not_called: datetime
      - input: "Before answering, call the calculator tool to calculate 18 * 7."
        assert:
          all:
            - response_not_empty: true
            - state_history_contains: lookup
            - tool_called:
                id: calculator
                count_gte: 1
                executed: true
                success: true
                result_path:
                  path: result
                  gte: 126
                  lte: 126
            - response_contains: "126"
