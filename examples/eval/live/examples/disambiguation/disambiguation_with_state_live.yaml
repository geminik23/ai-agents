name: Live Example - Disambiguation With State
agent: ../../../../yaml/disambiguation/disambiguation_with_state.yaml

# Live eval suite for intent clarification while remaining in the current state.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/disambiguation/disambiguation_with_state_live.yaml \
#     --output target/eval/live/examples/disambiguation/disambiguation_with_state \
#     --real-llm
#
# Flow: ambiguous cancellation -> live intent detection -> clarification while state remains main
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: state-disambiguation-asks-which-cancellation
    name: Real model clarifies cancellation intent before changing state
    tags: [live, examples, yaml, disambiguation, state-machine, routing, no-tools, real-llm]
    language: en
    turns:
      - input: "I want to cancel."
        assert:
          all:
            - response_not_empty: true
            - disambiguation: triggered
            - metadata_path:
                path: disambiguation.detection.type
                in: [missing_target, missing_action, multiple_intents, vague_reference]
            - metadata_path:
                path: disambiguation.detection.confidence
                gte: 0.0
                lt: 0.7
            - state: main
            - response_contains_any:
                - "order"
                - "subscription"
                - "cancel"
                - "which"
            - tool_not_called: calculator
            - tool_not_called: datetime
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
