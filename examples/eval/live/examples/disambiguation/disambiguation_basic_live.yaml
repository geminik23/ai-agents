name: Live Example - Disambiguation Basic
agent: ../../../../yaml/disambiguation/disambiguation_basic.yaml

# Live eval suite for the minimal ambiguous-input clarification flow.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/disambiguation/disambiguation_basic_live.yaml \
#     --output target/eval/live/examples/disambiguation/disambiguation_basic \
#     --real-llm
#
# Flow: vague request -> live ambiguity detection -> clarification without tool execution
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: basic-disambiguation-asks-for-target
    name: Real model asks for the missing target
    tags: [live, examples, yaml, disambiguation, routing, no-tools, real-llm]
    language: en
    turns:
      - input: "Send it."
        assert:
          all:
            - response_not_empty: true
            - disambiguation: triggered
            - metadata_path:
                path: disambiguation.detection.type
                in: [missing_target, missing_action, missing_parameters, vague_reference]
            - metadata_path:
                path: disambiguation.detection.confidence
                gte: 0.0
                lt: 0.6
            - response_contains_any:
                - "send"
                - "what"
                - "which"
                - "it"
            - tool_not_called: calculator
            - tool_not_called: datetime
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
