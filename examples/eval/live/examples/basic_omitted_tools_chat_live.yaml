name: Live Example - Basic Omitted Tools Chat
agent: ../../../yaml/basic/omitted_tools_chat.yaml

# Live eval suite for an agent that omits the top-level tools grant.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/basic_omitted_tools_chat_live.yaml \
#     --output target/eval/live/examples/basic_omitted_tools_chat \
#     --real-llm
#
# Flow: prompt that would normally need tools -> live model -> direct response with no ordinary tool execution
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 120000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

fixtures:
  llm:
    mode: real

scenarios:
  - id: omitted-tools-does-not-run-search
    name: Real model has no ordinary tool access when tools are omitted
    tags: [live, examples, yaml, grant, scoping, denial, real-llm]
    language: en
    turns:
      - input: "If you can inspect repository files, find where ToolExecutionContext is defined. If you cannot inspect files, say what you can do from conversation context only."
        assert:
          all:
            - response_not_empty: true
            - response_not_contains:
                - "I searched the repository"
                - "I inspected the file"
                - "I found it in crates"
                - "I read the file"
                - "I've searched the repository"
                - "I've read the file"
            - tool_not_called: grep
            - tool_not_called: file_read
            - tool_not_called: echo
