name: Live Example - Memory Budget
agent: ../../../../yaml/memory/memory_budget.yaml

# Live smoke suite for token-budgeted compacting memory.
# Requires provider credentials and may incur provider cost.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/live/examples/memory/memory_budget_live.yaml \
#     --output target/eval/live/examples/memory/memory_budget \
#     --real-llm
settings:
  temperature: 0.0
  seed: 1
  timeout_per_turn_ms: 60000
  timeout_per_scenario_ms: 360000
  retries: 1
  retry_delay_ms: 1000
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [alias, status]

fixtures:
  llm:
    mode: real

scenarios:
  - id: memory-budget-responds-after-compaction
    name: Real model remains usable after budgeted compaction
    tags: [live, examples, yaml, memory, compacting, budget, no-tools, real-llm]
    language: en
    turns:
      - input: "Remember architecture marker SERVICE-ALDER for a later check. Include SERVICE-ALDER in a brief reply."
        assert:
          all:
            - response_not_empty: true
            - response_contains: "SERVICE-ALDER"
      - input: "Remember platform marker KUBE-BIRCH for the later check. Include KUBE-BIRCH in a brief reply."
        assert:
          all:
            - response_not_empty: true
            - response_contains: "KUBE-BIRCH"
      - input: "Remember delivery marker PIPELINE-CEDAR for the later check. Include PIPELINE-CEDAR in a brief reply."
        assert:
          all:
            - response_not_empty: true
            - response_contains: "PIPELINE-CEDAR"
      - input: "Remember telemetry marker TRACE-DUSK for the later check. Include TRACE-DUSK in a brief reply."
        assert:
          all:
            - response_not_empty: true
            - response_contains: "TRACE-DUSK"
            - observability:
                dimension_counts:
                  - match_dimensions:
                      alias: router
                      status: success
                    assert:
                      path: count
                      gte: 1
                  - match_dimensions:
                      alias: default
                      status: success
                    assert:
                      path: count
                      gte: 4
      - input: "After the memory update, return the architecture marker and the telemetry marker."
        assert:
          all:
            - response_not_empty: true
            - llm_request:
                system_contains:
                  - "[Previous conversation summary]"
                  - "SERVICE-ALDER"
                user_contains: "After the memory update"
                same_request: true
                count: 1
            - response_contains_any:
                - "SERVICE-ALDER"
                - "TRACE-DUSK"
            - tool_not_called: command
            - tool_not_called: http
            - tool_not_called: file_write
            - tool_not_called: file_edit
            - tool_not_called: patch
