name: Runtime Optimization Baseline Mocked Eval
agent: ../yaml/runtime-optimization/pre_response_transition_disabled.yaml

# Runtime optimization baseline evaluation suite.
# Use this no-key suite together with runtime_optimization_mocked.yaml to compare
# default post-response routing against optimized pre-response routing.
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --agent examples/yaml/runtime-optimization/pre_response_transition_disabled.yaml \
#     --scenarios examples/eval/runtime_optimization_disabled_mocked.yaml \
#     --output target/eval/runtime_optimization_disabled_mocked
#
# Flow: fixture context -> greeting response -> post-response guard -> billing state -> mocked billing response -> assertions
settings:
  timeout_per_turn_ms: 5000  # milliseconds to wait for each turn. default: 30000
  retries: 0                 # keep baseline checks deterministic. default: 0
  isolation: scenario        # fresh runtime per attempt. default: scenario

fixtures:
  context:
    request:
      topic: billing
  llm:
    mode: mock
    responses:
      - "Greeting state mocked response."
      - "Billing state mocked response."

scenarios:
  - id: post-response-guard-routing
    name: Guard route transitions after baseline greeting response
    tags: [runtime, optimization, baseline, state]
    language: en
    turns:
      - input: I need billing help
        assert:
          all:
            - state: billing
            - response_contains: "Billing state"
