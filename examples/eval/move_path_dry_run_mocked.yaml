name: Move Path Mocked Eval
agent: ../yaml/tools/move_review.yaml

# No-key mocked eval for move_path dry-run behavior.
# Flow: user request -> mocked tool call -> dry-run move summary -> assertions
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/move_path_dry_run_mocked.yaml \
#     --output target/eval/move_path_dry_run_mocked
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"move_path","arguments":{"source_path":"examples/fixtures/tool_examples/edit_target.txt","destination_path":"examples/fixtures/tool_examples/moved_note.txt","dry_run":true}}'
      - "Dry-run move planned from edit_target.txt to moved_note.txt. No file was changed."

scenarios:
  - id: move-path-dry-run
    tags: [tools, move_path, mock, dry_run]
    turns:
      - input: Dry-run moving examples/fixtures/tool_examples/edit_target.txt to examples/fixtures/tool_examples/moved_note.txt.
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: move_path
                count_gte: 1
                executed: true
                success: true
            - tool_called:
                id: move_path
                args_executed:
                  path: dry_run
                  eq: true
            - tool_called:
                id: move_path
                result_path:
                  path: dry_run
                  eq: true
            - tool_called:
                id: move_path
                result_path:
                  path: moved
                  eq: true
            - response_contains_any:
                - "dry-run"
                - "dry run"
                - "Dry-run"
                - "No file was changed"
                - "no file was changed"