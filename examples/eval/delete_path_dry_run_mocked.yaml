name: Delete Path Mocked Eval
agent: ../yaml/tools/delete_review.yaml

# No-key mocked eval for delete_path dry-run behavior and recursive gating.
# Flow: user request -> mocked tool call -> dry-run delete summary -> assertions
#
# Usage:
#   cargo run -p ai-agents-cli -- eval \
#     --scenarios examples/eval/delete_path_dry_run_mocked.yaml \
#     --output target/eval/delete_path_dry_run_mocked
settings:
  timeout_per_turn_ms: 5000
  isolation: scenario

fixtures:
  llm:
    mode: mock
    responses:
      - '{"tool":"delete_path","arguments":{"path":"examples/fixtures/tool_examples/edit_target.txt","recursive":false,"dry_run":true}}'
      - "Dry-run delete planned for edit_target.txt. No file was changed."

scenarios:
  - id: delete-path-dry-run
    tags: [tools, delete_path, mock, dry_run]
    turns:
      - input: Dry-run deleting examples/fixtures/tool_examples/edit_target.txt.
        assert:
          all:
            - response_not_empty: true
            - tool_called:
                id: delete_path
                count_gte: 1
                executed: true
                success: true
            - tool_called:
                id: delete_path
                args_executed:
                  path: dry_run
                  eq: true
            - tool_called:
                id: delete_path
                result_path:
                  path: dry_run
                  eq: true
            - tool_called:
                id: delete_path
                result_path:
                  path: deleted
                  eq: true
            - response_contains_any:
                - "dry-run"
                - "dry run"
                - "Dry-run"
                - "No file was changed"
                - "no file was changed"