name: Speculative Auto Reasoning Plan Mocked Eval
agent: ../yaml/runtime-optimization/speculative_reasoning_auto.yaml

# Speculative branch evaluation suite.
# Use this no-key suite to verify that a plan-and-execute decision discards the plain draft and runs the committed plan path.
#
# Flow: user input -> plain draft + reasoning judge -> judge says plan_and_execute -> plan response -> assertions
settings:
  timeout_per_turn_ms: 5000
  retries: 0
  isolation: scenario

observability:
  enabled: true
  aggregation:
    dimensions: [branch_status, runtime_optimization, commit_behavior, speculative]

fixtures:
  llm:
    mode: mock
    responses_by_alias:
      default:
        - "Plan committed response."
      router:
        - "plan_and_execute"
        - '{"steps":[{"id":"answer","description":"Answer directly","action_type":"respond","action_target":"Provide the final answer","dependencies":[]}]}'

scenarios:
  - id: reasoning-plan
    name: Plan decision discards the plain draft
    tags: [runtime, optimization, branch, reasoning]
    language: en
    turns:
      - input: Make a small plan before answering
        assert:
          all:
            - response_contains: "Plan committed"
            - observability:
                dimension_counts:
                  - match_dimensions:
                      branch_status: committed
                    assert:
                      path: count
                      gte: 1
                  - match_dimensions:
                      branch_status: discarded
                    assert:
                      path: count
                      gte: 1
