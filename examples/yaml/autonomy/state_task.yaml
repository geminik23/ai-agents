name: StateTask
version: "1.0.0"
description: "State-scope exit with an explicit post-exit completion predicate"

# Arrival/construction does not start work. A handled ordinary input owns the declaring state subtree.
# Flow: input -> one task turn -> deterministic state exit -> post-exit gate, not unrelated destination work.
# Usage (offline): sh examples/eval/mocked/run_mocked_evals.sh --category autonomy
# Customize the declaring subtree and completion destination together; unrelated scope exit must remain incomplete.
system_prompt: Produce the response requested in the active state.
llm: {provider: openai, model: gpt-5.4-mini}
tools: []
# A fixed guard makes this protocol example deterministic; use semantic transitions for language-dependent routing.
states:
  initial: work
  states:
    work:
      autonomy:
        enabled: true
        mode: state_until_exit
        max_turns: 3  # Scope work-cycle allowance; resolved default: 30.
        max_llm_calls: 4  # Managed-call allowance; resolved default: 60.
        completion: {state: resolved}
      transitions:
        - to: resolved
          guard: 'true'
    resolved:
      prompt: Unrelated destination work must not be regenerated by the task.
