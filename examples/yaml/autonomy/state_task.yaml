name: StateTask
version: "1.0.0"
description: "State-scope exit with an explicit post-exit completion predicate"

# Arrival/construction does not start work. A handled ordinary input owns the declaring state subtree.
# Flow: input -> one task turn -> deterministic state exit -> post-exit gate, not unrelated destination work.
system_prompt: Produce the response requested in the active state.
llm: {provider: openai, model: gpt-5.4-mini}
tools: []
states:
  initial: work
  states:
    work:
      autonomy:
        enabled: true
        mode: state_until_exit
        max_turns: 3
        max_llm_calls: 4
        completion: {state: resolved}
      transitions:
        - to: resolved
          guard: 'true'
    resolved:
      prompt: Unrelated destination work must not be regenerated by the task.
