name: WorldTask
version: "1.0.0"
description: "World-state completion from a version-bound host predicate"

# Rust binds the world adapter to actual host state. Natural-language location claims are not world-state evidence.
# Flow: admitted action -> host world revision changes -> predicate observation -> completion.
system_prompt: Reach the configured world goal using admitted domain actions.
llm: {provider: openai, model: gpt-5.4-mini}
tools: [domain]
autonomy:
  enabled: true
  max_turns: 5
  max_llm_calls: 12
  validation:
    checks: [{id: records, adapter: host.records, config: {domain: world}}]
  completion: {validator_passed: records}
