name: UnrelatedScopeExit
version: "1.0.0"
description: "Leaving an autonomous state is not proof of objective completion"

# Use this negative control to distinguish workflow movement from a verified business outcome.
# Usage (offline): sh examples/eval/mocked/run_mocked_evals.sh --category autonomy
# Flow: accepted input -> scoped work -> unrelated destination -> incomplete, with no destination replay.
# Customize the expected terminal state and actual business gate together; never equate any exit with success.
system_prompt: Work on the active objective without claiming unverified completion.
llm: {provider: openai, model: gpt-5.4-mini}
tools: []
states:
  initial: work
  states:
    work:
      autonomy:
        enabled: true  # Opt into the declaring state only; default: false.
        mode: state_until_exit
        max_turns: 3  # Work-cycle allowance; resolved default: 30.
        max_llm_calls: 4  # Managed-call allowance; resolved default: 60.
        completion: {state: resolved}
      transitions:
        - to: abandoned
          guard: 'true'  # A deterministic protocol fixture, not language-dependent intent matching.
    abandoned:
      prompt: This destination must not be regenerated by the scoped task.
    resolved: {}
