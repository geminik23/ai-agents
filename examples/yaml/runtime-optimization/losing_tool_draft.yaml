name: LosingToolDraftRouter
version: "1.0.0"
description: "Speculative route winner with inert losing tool-call draft"

# Losing tool-call draft example.
#
# Use this pattern to verify that parsed tool calls inside a losing draft remain inert.
# The transition branch can win before the main draft commits, so the echo tool call below must never execute.
#
# Cost warning: the discarded draft can still consume tokens even though its tool call is never executed.
#
# Flow: user input -> tool-call draft branch + transition branch
#                  -> transition wins -> discard draft tool call -> billing response
#                  -> transition misses -> commit draft -> execute tools normally
#
# Usage:
#   cargo run -p ai-agents-cli -- run examples/yaml/runtime-optimization/losing_tool_draft.yaml --plain
system_prompt: |
  You are a support router. Use tools only after the response path is committed.

llms:
  default:
    provider: openai
    model: gpt-5.4-mini
  router:
    provider: openai
    model: gpt-5.4-nano
llm:
  default: default
  router: router

runtime:
  optimization:
    enabled: true
    max_speculative_llm_calls_per_turn: 2  # one draft call plus one transition decision call. default: 0
    speculative_state_transitions: true    # enable response-independent parallel transitions. default: false
    max_parallel_runtime_tasks: 2          # bound branch work for this turn. default: 4

# Branch telemetry helps verify that losing tool-call drafts are discarded before execution.
# Inspect target/observability/losing_tool_draft/report.json after a turn.
observability:
  enabled: true
  aggregation:
    dimensions: [branch_status, runtime_optimization, commit_behavior, speculative]
  export:
    formats: [json]
    path: ./target/observability/losing_tool_draft/
    write_report: true

states:
  initial: triage
  states:
    triage:
      prompt: |
        Drafts may suggest tools, but tools execute only after the draft commits.
      transitions:
        - to: billing
          when: "User asks about billing, invoices, refunds, payment, or charges"
          timing: parallel        # evaluate beside a draft response. default: post_response
          requires_response: false

    billing:
      prompt: |
        You are in the billing support state. Ask for the invoice or charge details.

memory:
  type: in-memory
  max_messages: 20

tools:
  - echo

metadata:
  cli:
    welcome: "=== Runtime Optimization: Losing Tool Draft ==="
    hints:
      - "Try: I was charged twice"
      - "The echo tool call in a losing draft must not execute"
      - "Use eval tool assertions to verify no losing tool side effects"
    show_state: true
    show_timing: true
