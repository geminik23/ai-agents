name: SpeculativeSkillRouter
version: "1.0.0"
description: "Speculative skill routing with losing draft discard"

# Speculative skill routing example.
#
# Use this pattern when skill routing often matches, but no-match turns should not wait for the router before a draft starts.
# The runtime starts a normal draft and a pure skill-selection branch together. Skill steps run only if the skill branch wins.
#
# Cost warning: a discarded draft still counts as an LLM call. Keep the cap low and enable observability when tuning.
#
# Flow: user input -> main draft branch + skill selection branch
#                  -> skill selected -> discard draft -> execute skill
#                  -> no skill -> commit draft
#
# Usage:
#   cargo run -p ai-agents-cli -- run examples/yaml/runtime-optimization/speculative_skill_routing.yaml --plain
system_prompt: |
  You are a helpful assistant. If no skill wins, answer normally.

llms:
  default:
    provider: openai
    model: gpt-5.4-mini
  router:
    provider: openai
    model: gpt-5.4-nano
llm:
  default: default
  router: router

runtime:
  optimization:
    enabled: true
    max_speculative_llm_calls_per_turn: 2  # one draft call plus one skill-router call. default: 0
    speculative_skill_routing: true        # pure selection runs before skill side effects. default: false
    max_parallel_runtime_tasks: 2          # bound branch work. default: 4

# Branch telemetry makes match, no-match, and discarded draft outcomes visible.
# Inspect target/observability/speculative_skill_routing/report.json after a turn.
observability:
  enabled: true
  aggregation:
    dimensions: [branch_status, runtime_optimization, commit_behavior, speculative]
  export:
    formats: [json]
    path: ./target/observability/speculative_skill_routing/
    write_report: true

skills:
  - id: simplify_explanation
    description: "Explain a topic in simple beginner-friendly language"
    trigger: "User asks to explain something simply, in plain language, or for a beginner"
    steps:
      # Step 0: The skill runs only after its branch commits.
      - prompt: |
          The user asked: "{{ user_input }}"

          Explain the topic in simple language with one short analogy.
          Keep the answer under five sentences.

memory:
  type: in-memory
  max_messages: 20

tools: []

metadata:
  cli:
    welcome: "=== Runtime Optimization: Speculative Skill Routing ==="
    hints:
      - "Try: Explain embeddings in simple terms"
      - "Try: Say hello normally"
      - "Skill execution starts only after the skill branch wins"
    show_timing: true
