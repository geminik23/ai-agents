name: PricingFileMetricsAssistant
version: "1.0.0"
description: "Load observability model pricing from a shared file"

# Pricing-file observability example.
#
# Use this pattern when several agents share the same model pricing table.
# The pricing file keeps common prices in one place, while inline pricing can override entries.
#
# Usage:
#   cargo run -p ai-agents-cli -- run examples/yaml/observability/pricing_file.yaml --plain
#
# Prerequisites:
#   - pricing.yaml must stay next to this file because pricing_file is resolved relative to this YAML file.
#
# Flow: user input -> main LLM -> token usage -> pricing file lookup -> cost table in report
#                  -> inline pricing override wins when the same provider/model exists in both places
#
# Inspect:
#   target/observability/pricing_file/report.json
#   target/observability/pricing_file/aggregates.csv
system_prompt: |
  You are a concise assistant for cost-observability demos.
  Answer in one or two short sentences.

llm:
  provider: openai
  model: gpt-5.4-nano

observability:
  enabled: true

  # Load shared model prices from a file.
  # Relative paths are resolved from this YAML file's directory.
  cost:
    enabled: true                 # estimate cost from token usage and pricing. default: true
    pricing_file: ./pricing.yaml  # load JSON or YAML pricing map before the agent runs
    unknown_price_policy: omit    # unknown prices stay out of totals. default: omit

    # Inline pricing overrides the file when keys match.
    # This lets one agent temporarily override a shared pricing table.
    pricing:
      openai/gpt-5.4-nano:
        input_per_1k: 0.0002
        output_per_1k: 0.00125

  # Group by model and purpose so the report shows which priced model produced cost.
  aggregation:
    dimensions: [model, purpose, status]

  # Keep raw content out of exported reports and raw events.
  privacy:
    include_prompts: false    # do not retain raw prompt text. default: false
    include_responses: false  # do not retain raw response text. default: false
    hash_inputs: true         # retain stable hashes for correlation. default: true

  export:
    formats: [json, csv]
    path: ./target/observability/pricing_file/
    write_report: true

metadata:
  cli:
    welcome: "=== Observability Pricing File Demo ==="
    hints:
      - "Try conversation"
      - "Inspect target/observability/pricing_file/report.json"
      - "Open examples/yaml/observability/pricing.yaml to see shared prices"
    show_timing: true
