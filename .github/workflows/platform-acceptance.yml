name: Platform acceptance

# This workflow runs on the investigation branch while the platform checks are being developed.
on:
  push:
    branches:
      - fix/windows-cli-and-macos-restoration

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RELEASE_RUST: "1.97.0"

jobs:
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install release toolchain
        run: |
          rustup toolchain install $env:RELEASE_RUST --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD
          rustc "+$env:RELEASE_RUST" -Vv
      - name: Run CLI regressions on the default stack
        run: |
          cargo "+$env:RELEASE_RUST" test --locked -p ai-agents-cli --test task_cli -- --exact `
            task_subprocess_usage_and_unsupported_resume_do_not_call_provider `
            task_overrides_preflight_precedes_provider_credentials `
            task_subprocess_retained_stage_review_and_cancel_preserve_exact_results `
            task_subprocess_stale_response_is_not_rebound_and_explicit_resume_works `
            task_subprocess_task_owned_child_questions_keep_one_coordinating_request

  macos-restoration:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      AI_AGENTS_REQUIRE_NATIVE_RESTORE_CLOCK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install release toolchain
        run: |
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          git rev-parse HEAD
          sw_vers
          rustc "+$RELEASE_RUST" -Vv
      - name: Require native SQLite restart and recovery
        env:
          CLOCK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          bash .github/scripts/with-macos-ntp.sh cargo "+$RELEASE_RUST" test --locked -p ai-agents-cli --test task_cli -- --exact --show-output \
            task_subprocess_configured_restart_preserves_attempts_and_requires_fresh_review \
            task_subprocess_configured_constructor_crash_recovers_without_replay
