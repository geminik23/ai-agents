[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ai-agents-eval = { workspace = true }

ai-agents-runtime = { workspace = true }
ai-agents-skills = { workspace = true }
ai-agents-tools = { workspace = true }
anyhow = { workspace = true }
minijinja = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"], optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"], optional = true }

[features]
mcp-integration = ["dep:axum", "dep:rmcp", "dep:tokio", "dep:tokio-util", "dep:windows-sys"]
