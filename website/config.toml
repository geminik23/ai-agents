base_url = "https://ai-agents.rs"
title = "AI Agents Framework"
description = "Define AI agents in YAML and extend them in Rust. Build conversations, controlled tool execution, stateful workflows, and multi-agent systems."

# Compilation & build
compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

# These guides show agent template syntax literally, not as site content variables.
skip_content_templating = ["docs/**", "examples/**"]

# Taxonomies
taxonomies = [
    { name = "tags", feed = true, paginate_by = 20 },
]

# Markdown rendering
[markdown]
smart_punctuation = true

[markdown.highlighting]
style = "class"
light_theme = "github-light-high-contrast"
dark_theme = "github-dark-high-contrast"

# Search
[search]
include_title = true
include_description = true
include_content = true

# Link checker (build only)
[link_checker]
skip_prefixes = ["http://[::1]"]
skip_anchor_prefixes = ["https://github.com/"]

# Slugify
[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

# Extra site-wide variables
# Access these in templates via `config.extra.<key>`
[extra]
home_title = "ai-agents.rs — YAML-first AI Agent Framework in Rust"
site_name = "ai-agents.rs"
github = "https://github.com/geminik23/ai-agents"
crates_io = "https://crates.io/crates/ai-agents"
docs_rs = "https://docs.rs/ai-agents"
version = "1.1.1"
